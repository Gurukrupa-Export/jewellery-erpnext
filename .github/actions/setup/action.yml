name: "Setup Frappe Environment"
description: "Checks out code, sets up Python/Node/DBs, and runs install.sh"

runs:
  using: "composite"
  steps:
    - name: Checkout Fixture Branch
      uses: actions/checkout@v4
      with:
        repository: Gurukrupa-Export/jewellery-erpnext
        ref: git_action_v16
        path: fixture_source

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        cache: "pip"

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: Cache uv
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-v2-${{ hashFiles('install.sh') }}

    - name: Install System Dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y redis-server mariadb-client redis-tools libmariadb-dev pkg-config build-essential libffi-dev libssl-dev

        wget -q -O /tmp/wkhtmltox.deb https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-2/wkhtmltox_0.12.6.1-2.jammy_amd64.deb
        sudo apt-get install -y /tmp/wkhtmltox.deb

    - name: Make Install Script Executable
      shell: bash
      run: chmod +x install.sh

    - name: Install Bench and Apps
      shell: bash
      run: ./install.sh

    - name: Migrate
      shell: bash
      run: |
        cd ~/frappe-bench
        bench --site test_site migrate

    - name: Create Test Data
      shell: bash
      run: |
        cd ~/frappe-bench
        bench --site test_site execute jewellery_erpnext.create_test_data.create_test_data
