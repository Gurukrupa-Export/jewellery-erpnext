name: Core Tests

on:
  pull_request:
    branches:
      - v16_develop_aerele
      - kgg_uat
      - kggk_prod
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: travis
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptravis"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:6
        ports:
          - 6379:6379

    env:
      DB: mariadb
      TYPE: server

    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4

      - name: Setup CI Environment
        uses: ./.github/actions/setup

      - name: Run Core Tests
        run: |
          cd ~/frappe-bench
          echo "Running Core Tests..."

          # Each suite runs inside its own log group, and a failure is reported as a
          # GitHub annotation naming the exact command. Without this the step is one
          # opaque `bash -e` block: the first non-zero `bench` aborts it and the only
          # annotation is "Process completed with exit code 1", so identifying which
          # suite broke means reading the whole raw log -- which needs repo admin.
          run() {
            echo "::group::$*"
            if bench --site test_site run-tests "$@"; then
              echo "::endgroup::"
            else
              status=$?
              echo "::endgroup::"
              echo "::error::FAILED: bench --site test_site run-tests $*"
              exit $status
            fi
          }
          run --app jewellery_erpnext --doctype "Sketch Order Form"
          run --app jewellery_erpnext --doctype "Department IR"
          run --app jewellery_erpnext --doctype "Employee IR"

          run --module jewellery_erpnext.jewellery_erpnext.tests.test_quotation
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_sales_order
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_bom
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_employee_ir_loss_baseline
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_warehouse_stock_entry
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_ownership_priority
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_fg_bom_field_configuration
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_repair_and_fg_bom
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_filters
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_loss_row_ownership
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_supplier_allowed_items
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_purchase_order
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_purchase_invoice
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_sales_invoice
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_bulk_map
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_serial_reference
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_item
