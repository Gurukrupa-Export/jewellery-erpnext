name: Core Tests

on:
  pull_request:
    branches:
      - v16_develop_aerele
      - kggk_uat
      - kggk_prod
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: travis
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptravis"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:6
        ports:
          - 6379:6379

    env:
      DB: mariadb
      TYPE: server

    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4

      - name: Setup CI Environment
        uses: ./.github/actions/setup

      - name: Run Core Tests
        run: |
          cd ~/frappe-bench
          echo "Running Core Tests..."
          bench --site test_site run-tests --app jewellery_erpnext --doctype "Sketch Order Form"
          bench --site test_site run-tests --app jewellery_erpnext --doctype "Department IR"
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.doctype.department_ir.tests.test_pc_tagging_stock_sync
          bench --site test_site run-tests --app jewellery_erpnext --doctype "Employee IR"

          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_quotation
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_sales_order
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_bom
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_keep_last_7_days_of_error_log
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_employee_ir_loss_baseline
          # Added 2026-09-29 (EMP-IR-Labh-2026-14111): the receive's Process Loss child batch,
          # and the customer-loss timeline note after a successful submit (no dialog on save or submit).
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_employee_ir_customer_loss_child_batch
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_customer_loss_spill_message
          # The three Employee IR loss gates. The blanket per-material gate had no CI
          # entry at all until now, so the gate the customer-finding gate mirrors was
          # unguarded.
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_material_loss_gate
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_customer_finding_loss_gate
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_current_operation_guard
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_current_operation_audit_repair
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_warehouse_stock_entry
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_ownership_priority
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_fg_bom_field_configuration
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_repair_and_fg_bom
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_filters
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_loss_row_ownership
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_supplier_allowed_items
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_purchase_order
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_purchase_invoice
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_sales_invoice
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_bulk_map
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_serial_reference
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_item
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_not_allowed_attribute_values
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_data_export
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_foreign_attachments
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_log_table_maintenance
