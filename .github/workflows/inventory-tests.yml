name: Inventory Tests

on:
  pull_request:
    branches:
      - v16_develop_aerele
      - kgg_uat
      - kggk_prod
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: travis
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptravis"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:6
        ports:
          - 6379:6379

    env:
      DB: mariadb
      TYPE: server

    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4

      - name: Setup CI Environment
        uses: ./.github/actions/setup

      - name: Run Inventory Tests
        run: |
          cd ~/frappe-bench
          echo "Running Inventory Tests..."

          # Each suite runs inside its own log group, and a failure is reported as a
          # GitHub annotation naming the exact command. Without this the step is one
          # opaque `bash -e` block: the first non-zero `bench` aborts it and the only
          # annotation is "Process completed with exit code 1", so identifying which
          # suite broke means reading the whole raw log -- which needs repo admin.
          run() {
            echo "::group::$*"
            if bench --site test_site run-tests "$@"; then
              echo "::endgroup::"
            else
              status=$?
              echo "::endgroup::"
              echo "::error::FAILED: bench --site test_site run-tests $*"
              exit $status
            fi
          }

          run --app jewellery_erpnext --doctype "MOP Log"
          run --app jewellery_erpnext --doctype "Serial Number Creator"
          run --app jewellery_erpnext --doctype "Subcontracting Log"
          run --app jewellery_erpnext --doctype "Diamond Conversion"
          run --app jewellery_erpnext --doctype "MOP Settings"
          run --app jewellery_erpnext --doctype "Subcontracting Settings"

          run --module jewellery_erpnext.jewellery_erpnext.tests.test_mop_weight_recalc
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_snc_submit_guard
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_repack
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_validate_pcs_batch_split
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_batch_rate
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_sample_goods_guard
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_entered_metal_rate
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_stock_entry
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_customer_gold_receipt
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_make_receive_entry_mop_cap
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_receive_batch_ownership
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_ledger_vs_scale
