name: Inventory Tests

on:
  pull_request:
    branches:
      - v16_develop_aerele
      - kggk_uat
      - kggk_prod
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: travis
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptravis"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:6
        ports:
          - 6379:6379

    env:
      DB: mariadb
      TYPE: server

    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4

      - name: Setup CI Environment
        uses: ./.github/actions/setup

      - name: Run Inventory Tests
        run: |
          cd ~/frappe-bench
          echo "Running Inventory Tests..."
          bench --site test_site run-tests --app jewellery_erpnext --doctype "MOP Log"
          bench --site test_site run-tests --app jewellery_erpnext --doctype "Serial Number Creator"
          bench --site test_site run-tests --app jewellery_erpnext --doctype "Subcontracting Log"
          bench --site test_site run-tests --app jewellery_erpnext --doctype "Diamond Conversion"
          bench --site test_site run-tests --app jewellery_erpnext --doctype "MOP Settings"
          bench --site test_site run-tests --app jewellery_erpnext --doctype "Subcontracting Settings"

          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_mop_weight_recalc
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_snc_submit_guard
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_repack
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_validate_pcs_batch_split
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_batch_rate
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_restamp_batch_rate_from_ledger
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_backfill_blended_batch_metal_rate
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_customer_voucher_type
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_sample_goods_guard
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_entered_metal_rate
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_stock_entry
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_customer_gold_receipt
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_make_receive_entry_mop_cap
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_fg_serial_bom_weights
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_material_weight_totals
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_customer_gold_rate
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_tracking_bom_security
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_customer_gold_dispatch
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_settlement_basis_mismatch
          # C09/C12, added 2026-09-14. CI runs a curated allowlist -- a new test_*.py does NOT
          # execute unless it is named here. That collection gap is what C14 actually is, so a
          # suite added by the Customer Gold programme and left unregistered would reproduce it.
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_customer_gold_components
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_customer_gold_fulfilment
          bench --site test_site run-tests --module jewellery_erpnext.customer_subcontracting.doctype.subcontracting_settings.test_subcontracting_settings
          # F1-F6 (KLHGX62F1119), added 2026-09-24. Pure-logic; none writes a document.
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_customer_gold_fg_valuation
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_customer_gold_settlement_lineage
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_customer_gold_settlement_accounts
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_customer_gold_rate_check
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_company_material_ownership
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_snc_design_tolerance
          # Secondary KLHGX62F1119 findings (F28, F29, F11). Pure-logic.
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_customer_gold_stage
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_customer_gold_reservation
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_customer_diamond_substitution
          # NOT registered here on purpose: tests.test_customer_gold_integration. It requires the
          # disposable site's masters (company, warehouses, Gold Rates, accounts) and exercises the
          # Nominal valuation policy, which must never run against a shared CI site. It runs with:
          #   bench --site cg-integration.test run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_customer_gold_integration
