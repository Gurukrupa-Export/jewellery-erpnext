name: Manufacturing Tests

on:
  pull_request:
    branches:
      - v16_develop_aerele
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: travis
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptravis"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:6
        ports:
          - 6379:6379

    env:
      DB: mariadb
      TYPE: server

    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4

      - name: Setup CI Environment
        uses: ./.github/actions/setup

      - name: Run Manufacturing Tests
        run: |
          cd ~/frappe-bench
          echo "Running Manufacturing Tests..."
          bench --site test_site run-tests --app jewellery_erpnext \
            --doctype "Manufacturing Plan" \
            --doctype "Parent Manufacturing Order" \
            --doctype "Manufacturing Work Order" \
            --doctype "Manufacturing Operation" \
            --doctype "Metal Conversions"

          bench --site test_site run-tests --app jewellery_erpnext \
            --module jewellery_erpnext.jewellery_erpnext.tests.test_material_request_transfer_se \
            --module jewellery_erpnext.jewellery_erpnext.tests.test_material_request_mop_department \
            --module jewellery_erpnext.jewellery_erpnext.tests.test_material_request_customizations \
            --module jewellery_erpnext.jewellery_erpnext.tests.test_stock_reservation_entry_mwo \
            --module jewellery_erpnext.jewellery_erpnext.tests.test_make_receive_entry_mop_cap \
            --module jewellery_erpnext.jewellery_erpnext.tests.test_mould_id_propagation \
            --module jewellery_erpnext.jewellery_erpnext.tests.test_unpack_repair_bom \
            --module jewellery_erpnext.jewellery_erpnext.tests.test_conversion_lane_downstream \
            --module jewellery_erpnext.jewellery_erpnext.tests.test_manufacturing_operation_balance_details_report \
            --module jewellery_erpnext.jewellery_erpnext.tests.test_process_loss_valuation \
            --module jewellery_erpnext.jewellery_erpnext.tests.test_mwo_photoshop_images
