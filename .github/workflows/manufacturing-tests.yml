name: Manufacturing Tests

on:
  pull_request:
    branches:
      - v16_develop_aerele
      - kgg_uat
      - kggk_prod
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: travis
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptravis"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:6
        ports:
          - 6379:6379

    env:
      DB: mariadb
      TYPE: server

    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4

      - name: Setup CI Environment
        uses: ./.github/actions/setup

      - name: Run Manufacturing Tests
        run: |
          cd ~/frappe-bench
          echo "Running Manufacturing Tests..."
          bench --site test_site run-tests --app jewellery_erpnext --doctype "Manufacturing Plan"
          bench --site test_site run-tests --app jewellery_erpnext --doctype "Parent Manufacturing Order"
          bench --site test_site run-tests --app jewellery_erpnext --doctype "Manufacturing Work Order"
          bench --site test_site run-tests --app jewellery_erpnext --doctype "Manufacturing Operation"
          bench --site test_site run-tests --app jewellery_erpnext --doctype "Metal Conversions"

          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_material_request_transfer_se
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_material_request_mop_department
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_material_request_customizations
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_backfill_material_request_total_pcs
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_backfill_material_request_total_pcs_db
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_stock_reservation_entry_mwo
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_make_receive_entry_mop_cap
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_mould_id_propagation
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_unpack_repair_bom
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_conversion_lane_downstream
          # Added 2026-09-14. This suite was never in the allowlist despite covering the lane
          # apportionment that conversion_lane_downstream depends on, and it now also carries the
          # C09 released-alloy carve-out cases.
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.doctype.metal_conversions.test_metal_conversions
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_manufacturing_operation_balance_details_report
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_process_loss_valuation
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_mwo_photoshop_images
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_fg_loss_rollup
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.doctype.serial_number_creator.test_serial_number_creator --case TestTrackingBomStaysThePlan
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.doctype.mop_log.test_mop_log
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.doctype.mop_log.test_mop_lineage_stock_entry_bridge
          bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_material_request_department_transfer
