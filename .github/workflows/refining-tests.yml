name: Refining & Advanced Tests

on:
  pull_request:
    branches:
      - v16_develop_aerele
      - kgg_uat
      - kggk_prod
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: travis
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptravis"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:6
        ports:
          - 6379:6379

    env:
      DB: mariadb
      TYPE: server

    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4

      - name: Setup CI Environment
        uses: ./.github/actions/setup

      - name: Run Refining & Advanced Tests
        run: |
          cd ~/frappe-bench
          echo "Running Refining & Advanced Tests..."

          # Each suite runs inside its own log group, and a failure is reported as a
          # GitHub annotation naming the exact command. Without this the step is one
          # opaque `bash -e` block: the first non-zero `bench` aborts it and the only
          # annotation is "Process completed with exit code 1", so identifying which
          # suite broke means reading the whole raw log -- which needs repo admin.
          run() {
            echo "::group::$*"
            if bench --site test_site run-tests "$@"; then
              echo "::endgroup::"
            else
              status=$?
              echo "::endgroup::"
              echo "::error::FAILED: bench --site test_site run-tests $*"
              exit $status
            fi
          }
          run --app jewellery_erpnext --doctype "Refining Entry"
          run --app jewellery_erpnext --doctype "Refinery Price List"
          run --app jewellery_erpnext --doctype "Manufacturing Setting"
          run --app jewellery_erpnext --doctype "Product Certification"
          run --app jewellery_erpnext --doctype "Tree Number"

          run --module jewellery_erpnext.jewellery_erpnext.tests.test_serialize
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_lock_order
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_submission_queue_dedup
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_tree_casting
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_tree_material_balance
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_tree_employee_ir_receive
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_bounded_retry
          run --module jewellery_erpnext.jewellery_erpnext.tests.test_db_isolation
