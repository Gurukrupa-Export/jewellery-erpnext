name: Refining & Advanced Tests

on:
  pull_request:
    branches:
      - v16_develop_aerele
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: travis
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptravis"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:6
        ports:
          - 6379:6379

    env:
      DB: mariadb
      TYPE: server

    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4

      - name: Setup CI Environment
        uses: ./.github/actions/setup

      - name: Run Refining & Advanced Tests
        run: |
          cd ~/frappe-bench
          echo "Running Refining & Advanced Tests..."
          bench --site test_site run-tests --app jewellery_erpnext \
            --doctype "Refining Entry" \
            --doctype "Refinery Price List" \
            --doctype "Manufacturing Setting" \
            --doctype "Product Certification" \
            --doctype "Tree Number"

          bench --site test_site run-tests --app jewellery_erpnext \
            --module jewellery_erpnext.jewellery_erpnext.tests.test_serialize \
            --module jewellery_erpnext.jewellery_erpnext.tests.test_lock_order \
            --module jewellery_erpnext.jewellery_erpnext.tests.test_submission_queue_dedup \
            --module jewellery_erpnext.jewellery_erpnext.tests.test_tree_casting \
            --module jewellery_erpnext.jewellery_erpnext.tests.test_tree_material_balance \
            --module jewellery_erpnext.jewellery_erpnext.tests.test_tree_employee_ir_receive \
            --module jewellery_erpnext.jewellery_erpnext.tests.test_bounded_retry \
            --module jewellery_erpnext.jewellery_erpnext.tests.test_db_isolation
