name: Frappe App Tests

on:
  pull_request:
    branches:
      - v16_develop_aerele
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-prepare:
    runs-on: ubuntu-latest
    
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: travis
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptravis"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:6
        ports:
          - 6379:6379

    env:
      DB: mariadb
      TYPE: server

    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4

      - name: Checkout Fixture Branch
        uses: actions/checkout@v4
        with:
          repository: Gurukrupa-Export/jewellery-erpnext
          ref: git_action_v16
          path: fixture_source

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('install.sh') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server mariadb-client redis-tools wkhtmltopdf build-essential libffi-dev libssl-dev

      - name: Make Install Script Executable
        run: chmod +x install.sh

      - name: Install Bench and Apps
        run: ./install.sh

      - name: Migrate & Create Test Data
        run: |
          cd ~/frappe-bench
          bench --site test_site migrate
          bench --site test_site execute jewellery_erpnext.create_test_data.create_test_data

      - name: Backup Database
        run: |
          cd ~/frappe-bench
          bench --site test_site backup
          
      - name: Upload DB Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: ~/frappe-bench/sites/test_site/private/backups/*-database.sql.gz
          retention-days: 1

  test-matrix:
    needs: build-and-prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: travis
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptravis"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:6
        ports:
          - 6379:6379

    env:
      DB: mariadb
      TYPE: server

    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4

      - name: Checkout Fixture Branch
        uses: actions/checkout@v4
        with:
          repository: Gurukrupa-Export/jewellery-erpnext
          ref: git_action_v16
          path: fixture_source

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('install.sh') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server mariadb-client redis-tools wkhtmltopdf libffi-dev libssl-dev

      - name: Make Install Script Executable
        run: chmod +x install.sh

      - name: Install Bench and Apps (Skip Site Setup)
        run: ./install.sh --skip-site-setup

      - name: Download DB Backup Artifact
        uses: actions/download-artifact@v4
        with:
          name: db-backup
          path: ~/frappe-bench/sites/test_site/private/backups/

      - name: Restore Database
        run: |
          cd ~/frappe-bench
          BACKUP_FILE=$(ls -t sites/test_site/private/backups/*-database.sql.gz | head -1)
          echo "Restoring database from: $BACKUP_FILE"
          bench --site test_site restore $BACKUP_FILE \
            --db-root-password travis \
            --mariadb-root-username root
            
          echo "Syncing hooks and fixtures..."
          bench --site test_site migrate --skip-search-index

      - name: Run Test Group ${{ matrix.group }}
        run: |
          cd ~/frappe-bench
          
          echo "Starting Test Group ${{ matrix.group }}..."
          
          case ${{ matrix.group }} in
            1)
              echo "Running Core Flow & Manufacturing Tests..."
              bench --site test_site run-tests --app jewellery_erpnext --doctype "Sketch Order Form"
              bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_quotation
              bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_sales_order
              bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_bom
              bench --site test_site run-tests --app jewellery_erpnext --doctype "Department IR"
              bench --site test_site run-tests --app jewellery_erpnext --doctype "Employee IR"
              bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_employee_ir_loss_baseline
              bench --site test_site run-tests --app jewellery_erpnext --doctype "Manufacturing Plan"
              bench --site test_site run-tests --app jewellery_erpnext --doctype "Parent Manufacturing Order"
              bench --site test_site run-tests --app jewellery_erpnext --doctype "Manufacturing Work Order"
              bench --site test_site run-tests --app jewellery_erpnext --doctype "Manufacturing Operation"
              bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_material_request_transfer_se
              bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_stock_reservation_entry_mwo
              bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_make_receive_entry_mop_cap
              ;;
            2)
              echo "Running Inventory, Log, Advanced & System Tests..."
              bench --site test_site run-tests --app jewellery_erpnext --doctype "MOP Log"
              bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_mop_weight_recalc
              bench --site test_site run-tests --app jewellery_erpnext --doctype "Serial Number Creator"
              bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_snc_submit_guard
              bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_validate_pcs_batch_split
              bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_repack
              bench --site test_site run-tests --app jewellery_erpnext --doctype "Subcontracting Log"
              bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_bounded_retry
              bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_lock_order
              bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_serialize
              bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_submission_queue_dedup
              bench --site test_site run-tests --module jewellery_erpnext.jewellery_erpnext.tests.test_tree_casting
              bench --site test_site run-tests --app jewellery_erpnext --doctype "Refining Entry"
              bench --site test_site run-tests --app jewellery_erpnext --doctype "Product Certification"
              ;;
          esac
