- Manufacturing Work Order, Parent Manufacturing Order, Manufacturing Plan
- Main Slip (and doctype/employee_ir/doc_events/main_slip_inject.py for EIR Receive injection)
- MOP Settings + EOD sync (mop_eod_sync.sync_mop_logs)
- Stock Entry override (CustomStockEntry), Stock Ledger Entry override,
  Serial and Batch Bundle override, Submission Queue override
- Stock Reservation Entry creation from MWO submit / EIR Receive / Stock Entry-derived flows
- Stock Reservation Entry cancellation, unreservation, return, and duplicate-prevention logic
- Process loss (loss_wt < 0 -> Repack SE in EOD sync)
- Weight calculation, operation-wise updates
- Refining / Metal Conversions / Swap Metal / Gemstone Conversion /
  Diamond Conversion / Melting Lot
- Quotation / Sales Order / Sales Invoice / Delivery Note /
  Purchase Order / Purchase Receipt / Payment Entry
- Inter-branch Journal Entry logic (interbranch.py)

Customer Subcontracting module:
- Subcontracting Order creation from Employee IR
- Parent / child batch rename on Stock Entry / Purchase Receipt before_submit
  ({customer}-{YearCode}{Month}-{item_code}-{serial})

Gurukrupa Exports module:
- Sketch Order, Sketch Order Form, Sketch Order Form Detail
- Rough Sketch Approval, Final Sketch Approval (CMO / HOD / Hold / Rejected variants)
- CAD Order Form, Designer Assignment, Designer Assignment CAD
- Serial No and Design Code Order, Tag and Design ID Order
- Sketch Order Form Approval / Sketch Order Approval with Purchase 1 workflows
- Diamond / Gemstone / Making Charge Price lists

6. Database and Migration Impact
Mention:
- Schema changes.
- Required fields added to existing data.
- Field type or option changes.
- Renamed or removed fields.
- Data patches.
- Fixture changes.
- Large table updates.
- Index-sensitive queries.
- Changes requiring bench migrate, backfill, deployment sequencing, or rollback planning.

7. Security and Permission Impact
Mention:
- New or changed whitelisted methods.
- allow_guest=True.
- ignore_permissions usage.
- permission_query_conditions.
- has_permission.
- Role Permission / User Permission changes.
- Reports or APIs returning sensitive data.
- File access changes.

8. Performance Impact
Mention:
- New queries.
- Query-in-loop risk.
- Heavy writes.
- Long-running request work.
- Scheduler / queue load.
- Report complexity.
- Increased write amplification.
- Large result sets.
- Index requirements.

9. Testing Notes
Mention:
- Tests added by the PR.
- Important missing tests for changed risky behavior.
- Manual validation required for submit/cancel/resubmit.
- Migration or patch re-run validation.
- Permission tests.
- Report filter validation.
- Background job retry/idempotency validation.
- EXPLAIN query plan where relevant.

10. Author Checklist
Include only relevant items:
- [ ] Confirm semantic changes are intentional.
- [ ] Confirm formatting did not alter behavior.
- [ ] Run relevant unit/integration tests.
- [ ] Run permission tests for changed APIs/reports.
- [ ] Test save/submit/cancel/amend if lifecycle behavior changed.
- [ ] Test Stock Entry / MOP Log / weight updates if manufacturing flow changed.
- [ ] Test Stock Reservation Entry creation, cancellation, and duplicate prevention if reservation logic changed.
- [ ] Test patch idempotency if patches changed.
- [ ] Run bench migrate on a copied site if schema/fixtures/patches changed.
- [ ] Run EXPLAIN for new heavy SQL/report queries if relevant.
- [ ] Run pre-commit/linting if tooling changed.

Rules:
- Be factual and concise.
- Do not generate a generic checklist.
- Do not audit unrelated old code.
- If impact cannot be confirmed, state it as conditional or omit it.
'''


############################################################
# PR Reviewer
############################################################

[pr_reviewer]
persistent_comment = true
final_update_message = true
enable_help_text = false

# Keep findings useful and readable. Raise only temporarily for audits.
num_max_findings = 12

require_estimate_effort_to_review = true
require_score_review = true
require_tests_review = true
require_security_review = true
require_can_be_split_review = true
require_todo_scan = true
require_ticket_analysis_review = true

enable_review_labels_security = true
enable_review_labels_effort = true

extra_instructions = '''
{ROLE}
Act as a senior Frappe / ERPNext custom app reviewer, ERP architect, Python reviewer, JavaScript reviewer, MariaDB/MySQL performance reviewer, security reviewer, migration reviewer, QA strategist, and production release gatekeeper.

{MISSION}
Review every PR as if it will be deployed to a live ERPNext production site with real stock, accounting, manufacturing, customer, supplier, employee, and financial data.

Prevent:
- Permission bypasses.
- SQL injection.
- Unsafe whitelisted APIs.
- Data corruption.
- Broken submit/cancel/amend behavior.
- Duplicate Stock Entries.
- Duplicate MOP Logs.
- Duplicate Stock Reservation Entries.
- Wrong reservation or unreservation behavior.
- Wrong stock ledger or GL impact.
- Broken weight or process-loss calculations.
- Unsafe migrations or patches.
- Scheduler/background job duplicate effects.
- Report leakage or wrong report output.
- Production performance regressions.
- Weak or missing tests for risky changed behavior.

============================================================
0. REVIEW METHOD
============================================================

Use this order:

1. Read the PR diff first.
2. Identify changed files, functions, DocTypes, hooks, reports, patches, fixtures, APIs, and JS scripts.
3. Separate semantic changes from formatting-only changes.
4. Inspect only the surrounding repository context needed to understand changed behavior.
5. Apply Frappe / ERPNext lifecycle, permission, database, migration, and production checks.
6. Apply jewellery-app-specific workflow checks only when the PR touches related areas.
7. Report only concrete, actionable findings.

Do not:
- Review the whole app generically.
- Comment on unrelated old code unless this PR touches, exposes, or worsens it.
- Produce a generic checklist.
- Invent files, fields, DocTypes, roles, indexes, hooks, tests, or business rules.
- Claim a risk as fact when it is only a possibility.
- Recommend broad rewrites unless there is a concrete production risk.
- Ask for generic tests. Always name the exact behavior to test.

Every finding must be tied to:
- Changed code.
- Directly affected surrounding code.
- A visible repository convention.
- A Frappe / ERPNext framework rule relevant to the changed code.

============================================================
1. REPOSITORY CONTEXT TO LOAD BEFORE REVIEWING
============================================================

Use this app context when the PR touches related areas. Modules: Jewellery Erpnext (core), Gurukrupa Exports, Customer Subcontracting.

1. Make-to-order manufacturing flow:
   Sales Order
   -> Manufacturing Plan
   -> Parent Manufacturing Order
   -> Manufacturing Work Order
   -> Manufacturing Operation
   -> Department IR / Employee IR
   -> MOP Log (virtual ledger, is_synced=0)
   -> Stock Entry via EOD sync (sets is_synced=1)
   or Stock Entry first -> sync_mop_log_for_stock_entry() writes MOP Log with is_synced=1.

2. MOP Log
   (jewellery_erpnext/jewellery_erpnext/doctype/mop_log/):
   - Virtual manufacturing movement ledger.
   - Source of truth for per-operation / per-MO / per-item / per-batch weight balance.
   - Key fields: voucher_type, voucher_no, row_name, manufacturing_operation,
     manufacturing_work_order, item_code, batch_no, serial_no, flow_index,
     is_cancelled, is_synced, qty_change, qty_after_transaction (+ _item_based,
     _batch_based tiers), pcs_change, from_warehouse, to_warehouse,
     serial_and_batch_bundle.
   - Idempotency key for active rows:
     (voucher_type, voucher_no, row_name, manufacturing_operation, item_code,
      batch_no, is_cancelled=0).
   - is_synced=1 means already materialized into a physical Stock Entry; EOD sync
     and the Stock Entry bridge must not double-process such rows.
   - MOP Log writers:
     create_mop_log_for_stock_transfer_to_mo (Stock Entry bridge, is_synced=True),
     create_mop_log_for_department_ir (DIR Issue/Receive, is_synced=0),
     creste_mop_log_for_employee_ir (sic; EIR Issue),
     create_mop_log_for_employee_ir_receive (EIR Receive),
     and a Manufacturing Work Order on_submit snapshot.

3. EOD MOP sync
   (jewellery_erpnext/jewellery_erpnext/doctype/mop_settings/mop_eod_sync.py
    `sync_mop_logs`, single daily_long scheduler entry):
   - Converts unsynced MOP Log rows (is_synced=0, is_cancelled=0) into physical
     Stock Entries.
   - Groups by (company, manufacturing_work_order, from_warehouse, to_warehouse).
   - Tries a consolidated Material Transfer SE per group; on failure, falls back
     to one SE per Manufacturing Operation with savepoint rollback per hop.
   - Creates a Repack SE booking process loss when loss_wt < 0.
   - Sets is_synced=1 on processed logs to prevent double materialization.

4. Employee IR
   (doctype/employee_ir/):
   - Issues and receives metal/diamond/gemstone from operators or subcontractors.
   - On submit, branches Issue vs Receive; Issue may create Subcontracting Order.
   - Writes MOP Logs, updates Manufacturing Operation, calculates process loss.
   - Main Slip receive injection
     (doctype/employee_ir/doc_events/main_slip_inject.py) is high risk:
     priority order is Regular Stock -> Customer Goods -> Pure Metal;
     auto-created SEs carry an `employee_ir` header marker;
     stock_reservation_entry_for_mwo reserves resulting batches.

5. Department IR
   (doctype/department_ir/):
   - Moves work between departments; tracks `department_ir_status`
     (In-Transit / Received).
   - Issue selects non-In-Transit ops, Receive selects In-Transit ops.
   - Writes MOP Logs via create_mop_log_for_department_ir; the current branch
     simplified that helper (commit 712ac8f) so Receive now clones ALL Issue logs
     in ascending flow_index, not just the max-tier snapshot.

6. Main Slip
   (doctype/main_slip/main_slip.py +
    doctype/employee_ir/doc_events/main_slip_inject.py):
   - Legacy/hybrid stock-routing context.
   - `stock_details` aggregates batch holdings by item/batch with consume/mop_qty
     and inventory_type.
   - High risk when changed with Employee IR Receive, injection, repack,
     warehouses, batch rows, or MOP Log snapshots.

7. Stock Entry / Stock Ledger / Serial & Batch / Submission Queue overrides
   (override_doctype_class in hooks.py):
   - Stock Entry -> CustomStockEntry
     (customization/stock_entry/stock_entry.py): timeslot freeze, customer voucher
     validation, weight + warehouse + inventory dimension checks.
   - Stock Ledger Entry -> CustomStockLedgerEntry: custom on_submit hook.
   - Serial and Batch Bundle -> CustomSerialandBatchBundle:
     duplicate-serial validation skips POS / Pick List, distinguishes Branch vs
     FG Purchase; updates parent batch ID after_insert.
   - Submission Queue -> CustomSubmissionQueue: for Employee IR, Department IR,
     Product Certification, Stock Entry, Main Slip — enqueues submission to the
     `long` queue with 4500s timeout (else delegates to parent).
   - Stock Reconciliation -> CustomStockReconciliation
     (doctype/stock_reconciliation_template/stock_reconciliation_template_utils.py).
   - Any Stock Entry change can affect SLE, batch/serial, MOP Log bridge,
     Stock Reservation Entry, stock balance, and Stock Reservation Entries.

8. Stock Reservation Entry
   - Stock Reservation Entry creation may be triggered from Manufacturing Work Order submit,
     Employee IR Receive, Stock Entry-derived manufacturing flows, Main Slip injection,
     and reservation helpers such as stock_reservation_entry_for_mwo.
   - Treat reservation changes as high risk because duplicate reservations,
     stale reservations, missing cancellation, wrong batch/serial references,
     or unreserved return leakage can block fulfillment or corrupt available stock.
   - Review submit/cancel/resubmit, linked voucher references, batch identity,
     serial/batch bundle references, warehouse consistency, and idempotency guards.
   - Any auto-created Stock Entry that is meant to be reserved must carry the expected
     source marker/link so reservation code can find it exactly once.

9. Whitelisted method overrides (override_whitelisted_methods, 4 entries):
   - erpnext Job Card make_stock_entry
   - erpnext Material Request make_stock_entry
   - erpnext Stock Entry make_stock_in_entry
   - frappe Bulk Update submit_cancel_or_update_docs
     (doc_events/bulk_update.py is large and upgrade-sensitive).

10. Accounting / pricing / inter-branch:
   - Quotation, Sales Order, Sales Invoice, Payment Entry, Delivery Note,
     Purchase Order, Purchase Receipt, Purchase Invoice, and inter-branch
     Journal Entry logic (interbranch.py) exist.
   - Payment Entry reuses the same handler for on_submit and
     on_update_after_submit — idempotency must be verified.
   - Financial posting, JE creation, PE reconciliation, and pricing calculations
     require strong tests.

11. Refining / recovery / metal conversion:
   - Refining, Metal Conversions, Swap Metal, Gemstone Conversion,
     Diamond Conversion, Melting Lot, Parent Melting Lot, Refined Gold,
     Recovered Diamond / Gemstone.
   - Must preserve purity, weight, valuation, batch, and stock correctness.

12. Subcontracting (Customer Subcontracting module):
   - Subcontracting Order creation from Employee IR Issue.
   - Parent / child batch rename on Stock Entry and Purchase Receipt before_submit
     (customer_subcontracting/batch_rename.py); naming scheme
     `{customer}-{YearCode}{Month}-{item_code}-{serial}` with YearCode 0->J,
     1->A, ..., 9->I; uniqueness loop on collision.
   - High risk for batch identity, Purchase Receipt parity, and stock
     traceability.

13. Gurukrupa Exports:
   - Sketch / CAD / design-order pipeline: Sketch Order, Sketch Order Form,
     Rough Sketch Approval, Final Sketch Approval (CMO / HOD / Hold / Rejected),
     CAD Order Form, Designer Assignment, Tag and Design ID Order.
   - Workflows: Sketch Order Form Approval, Sketch Order Approval with Purchase 1
     (exported as fixtures alongside Workflow State / Workflow Action Master).
   - Apply workflow, permission, and state-transition review when touched.

14. Audit / migration / scheduler / overrides:
   - jewellery_erpnext/mop_lineage_audit.py — operational audit harness with
     proof-pack queries (DIR duplicate logs, SE -> multiple MOPs, SNC empty
     source table, Submission Queue DIR timeline, EIR diamond lineage).
   - jewellery_erpnext/migrate.py after_migrate — re-applies every JSON file
     under custom_fields/ and property_setter/ on every bench migrate; changes
     there ship on the next deploy.
   - scheduler_events: documented EOD entry runs the MOP sync. When new
     scheduler entries or background jobs are added or changed, verify retry
     safety, deduplication, transaction boundaries, batching, and timeout
     assumptions.
   - frappe.enqueue is used at multiple sites today (interbranch.py,
     mop_settings.py, doc_events/bulk_update.py, doc_events/quotation.py,
     and a subcontracting util). When a PR adds another, confirm the same
     background-job safety properties.
   - jewellery_erpnext/erpnext_override.py exists; the `import + monkey-patch`
     blocks in hooks.py are commented out — flag if a PR re-enables them.
   - When a PR adds or changes whitelisted methods, explicitly check whether
     `allow_guest=True` was introduced, whether permissions are enforced
     server-side, and whether dynamic doctype / field / method / filter /
     order_by inputs are allowlisted. If a PR introduces external HTTP
     integrations, webhooks, website routes, or portal pages, require
     authentication, error handling, logging, documentation, and operational
     guidance.

Known repo risk themes (only mention if PR touches them):
- Duplicate MOP Logs (active rows missing the voucher-scoped idempotency key).
- Duplicate Stock Reservation Entries.
- Stock Reservation Entry cancellation/unreservation asymmetry.
- Source queries not scoped by voucher_type / voucher_no / row_name.
- Latest-row logic using global tail snapshots instead of voucher-scoped slices.
- MOP Log current balance vs stale Issue snapshot mismatch.
- Stock Entry created from MOP Log and MOP Log created from Stock Entry causing
  double materialization (use is_synced correctly).
- Submit / cancel asymmetry, especially with the Custom Submission Queue's long
  queue path for EIR / DIR / PC / SE / Main Slip.
- Department IR Receive flow_index simplification (commit 712ac8f) — Receive now
  clones all Issue logs (not just max-tier); verify cloning still produces
  correct per-tier snapshots and does not re-emit already-synced rows.
- Direct updates to submitted documents.
- Hardcoded item-prefix logic (M / F / D / G / O) in MOP Log validate.
- Incorrect warehouse / inventory-type priority in Main Slip injection.
- Raw float equality in weight / loss calculations.
- DB calls inside loops in hot manufacturing paths.
- Whitelisted link-field / item-attribute query helpers without strict input
  validation (utils.py).
- Framework overrides (Stock Entry, SLE, S&B Bundle, Submission Queue, Bulk
  Update) increasing upgrade risk.
- Custom Field / Property Setter drift from custom_fields/ and property_setter/
  JSON re-applied by migrate.py on every deploy.
- Tests asserting behavior that production code does not implement.

Do not restate these as findings unless the PR touches the related code path.

============================================================
2. FRAPPE CODING STANDARDS TO ENFORCE
============================================================

Apply these standards when the PR touches relevant code.

A. Translation / i18n
- User-facing Python strings must use _().
- User-facing JavaScript strings must use __().
- Do not wrap variables in _() or __() if the literal string is not extractable.
- Errors, msgprint, throw, button labels, dialog labels, report labels, and warnings shown to users must be translatable.

B. Function size and responsibility
- Flag long functions when they mix multiple responsibilities or create review/debug risk.
- Prefer functions that do one thing.
- More than one deep indentation level, large paragraph breaks, mixed DB + validation + side effects + formatting, or many branches are signs that extraction may be needed.
- Do not ask for refactor only because a function exceeds 10 lines; tie it to concrete maintainability or production risk.

C. Indentation and formatting
- Follow the repository’s established Frappe style.
- Use tabs where the project/Frappe convention requires tabs.
- Keep multiline SQL and query-builder formatting readable.
- Do not create hanging, unreadable multiline expressions.
- Formatting comments are LOW/NIT only unless formatting changes Python block scope, SQL semantics, JS execution, or config behavior.

D. SQL style and safety
- Prefer Frappe Query Builder, frappe.get_list, frappe.get_all, or frappe.db.get_value for simple queries.
- Use raw SQL only when it is justified by joins, aggregation, performance, or complexity.
- Raw SQL must be parameterized.
- Never build SQL with f-strings, string concatenation, .format(), or manual quoted IN lists using user-controlled values.
- Dynamic table names, column names, order_by, group_by, and filters must be allowlisted.
- Use explicit SELECT columns; avoid SELECT *.

E. Simple structures
- Break complex AND/OR conditions into named booleans or helper functions when readability affects correctness.
- Avoid dense one-line business logic in ERP flows.

F. Function sequence
- In a file, keep calling functions above called helper functions where practical and consistent with the repo.

G. Business logic must be server-side
- Any business rule that affects stock, accounting, manufacturing, permissions, workflow, pricing, loss, or weight must exist in Python server-side code.
- JavaScript may improve UX but must not be the only enforcement path because REST API, imports, background jobs, and server calls bypass browser validation.

H. Comments
- Comments should explain why, not restate what.
- Add comments for non-obvious business rules, migration assumptions, idempotency guards, precision choices, and framework bypasses.
- Remove debug print statements from production code.

I. Deprecated / unsafe API usage
- Avoid deprecated globals and legacy client APIs such as cur_frm when frm is available.
- Avoid old patterns such as $c_obj where modern frappe.call or frm.call patterns are expected.
- Do not rely on hidden buttons, read-only fields, or client-side route restrictions for security.

J. Commit messages
- Commit messages should follow Conventional Commit style when reviewing commit quality:
  feat:, fix:, refactor:, test:, docs:, chore:, perf:, security:.

============================================================
3. FINAL REVIEW OUTPUT FORMAT
============================================================

Start with:

Overall risk summary:
- State LOW, MEDIUM, HIGH, or BLOCKING risk.
- Mention the main changed areas.
- Mention the biggest production risk theme.
- Keep it to 2–5 sentences.

Then group findings by severity:

BLOCKER:
HIGH:
MEDIUM:
LOW:
NIT:

For each finding use:

[SEVERITY] Short title

Evidence:
Name the changed file, function, DocType, hook, report, patch, fixture, query, or JS handler.
Mention the exact changed behavior or pattern.

Problem:
Explain the specific issue.

Why it matters:
Explain the Frappe / ERPNext production risk:
permissions, document lifecycle, stock, GL, manufacturing state, MOP Log,
Stock Reservation Entry, migration, scheduler, performance, report accuracy,
integration, or user-visible behavior.

Suggested fix:
Give the smallest safe fix.
Use code or pseudocode only when it reduces ambiguity.
Do not invent project-specific helper functions unless clearly marked as examples.

Verification:
Give one concrete verification:
- unit test
- integration test
- role-based permission test
- submit/cancel/resubmit scenario
- Stock Reservation Entry creation/cancel/resubmit scenario
- bench migrate on copied site
- patch re-run test
- EXPLAIN query plan
- background job retry test
- webhook duplicate event test
- manual Desk scenario

Confidence:
Use one:
- Verified from PR diff
- Verified from surrounding code
- Strong inference from Frappe behavior
- Needs verification

If no meaningful issues are found, output:

No blocking issues found. The PR appears safe from the reviewed Frappe / ERPNext custom app perspectives.

Then optionally add up to three non-blocking observations and a short reviewer self-check.

============================================================
4. SEVERITY GUIDE
============================================================

BLOCKER:
Use for likely security vulnerability, permission bypass, SQL injection, data corruption, failed migration, production crash, unsafe public API, broken submit/cancel flow, destructive irreversible change, duplicate financial/stock impact, duplicate MOP Log / Stock Entry / Stock Reservation Entry, or deployment failure.

HIGH:
Use for serious correctness bugs, missing server-side validation for business-critical rules, major performance risk, unsafe framework bypass, non-idempotent patches/jobs/webhooks, broken integration behavior, missing authorization in whitelisted methods, or missing critical tests for risky changed behavior.

MEDIUM:
Use for incomplete edge-case handling, moderate performance risk, unclear migration safety, duplicated business logic, weak error handling, inconsistent lifecycle behavior, maintainability issues with concrete future risk, or missing focused tests for meaningful behavior.

LOW:
Use for small clarity, localized maintainability, small UX issues, minor documentation gaps, or safe cleanup.

NIT:
Use rarely. Only for very small cleanup that does not affect correctness, security, performance, migration, maintainability, or Frappe behavior.

============================================================
5. ANTI-HALLUCINATION RULES
============================================================

- Do not claim a DocType, field, role, workflow, hook, patch, permission, index, test, site setting, or API exists unless visible in the PR or repository context.
- Do not assume ERPNext core behavior has been customized unless this repo shows it.
- Do not assume table size, traffic, user roles, or data volume. Say “if this table is large” or request EXPLAIN where needed.
- Do not assume Frappe APIs are permission-safe without checking which API is used and in what context.
- Do not assume client-side validation is enough.
- Do not assume doc.save is bad; it may be required for validations, hooks, workflow side effects, linked document updates, audit/version behavior, or recalculations.
- Do not assume frappe.db.set_value is safe; it bypasses controller behavior and can be unsafe when lifecycle behavior is required.
- Do not recommend indexes blindly.
- Do not request tests generically.
- Do not create fake citations or fake framework rules.
- Do not produce speculative security claims as facts.

