############################################################
# Qodo Merge / PR-Agent Configuration
# Target: Frappe / ERPNext custom jewellery manufacturing app
#
# App: jewellery_erpnext (Frappe v15 / ERPNext custom app)
# Modules (modules.txt):
#   - Jewellery Erpnext        (core manufacturing, MOP Log, stock, refining, accounting)
#   - Gurukrupa Exports        (sketch / CAD / design-order pipeline + workflows)
#   - Customer Subcontracting  (vendor outsourcing + parent/child batch rename)
#
# Stack:
# - Frappe Framework / ERPNext, Python, JavaScript, MariaDB / MySQL
# - DocTypes, child tables, hooks.py, fixtures, patches, custom_fields/, property_setter/
# - reports, workflows, print formats
# - background jobs, scheduler events, custom Submission Queue
# - whitelisted methods, REST APIs
# - Stock, Manufacturing, Accounting, MOP Log, jewellery workflows
#
# Documented framework integration points in hooks.py (verify against current source):
# - override_doctype_class: standard ERPNext Stock Entry, Stock Reconciliation,
#   Stock Ledger Entry, Serial and Batch Bundle, and Submission Queue
#   controllers are overridden. Treat as bench-wide blast radius.
# - override_whitelisted_methods: standard Frappe / ERPNext core endpoints are
#   intercepted (Job Card / Material Request / Stock Entry SE creators, and a
#   bench-wide Bulk Update intercept). Treat as upgrade-sensitive.
# - scheduler_events: a daily_long entry runs the MOP EOD sync.
# - after_migrate: jewellery_erpnext.migrate.after_migrate re-applies every
#   JSON file under custom_fields/ and property_setter/ on every bench migrate.
# - patches.txt: the active post_model_sync patches are documented as
#   non-destructive; verify any new patch is idempotent and safe to re-run.
# - fixtures: a narrowly-filtered allowlist (sketch workflows, a small set of
#   Sketch Order custom fields, a small role list); not a wholesale doctype
#   export. Coordinate fixture changes with custom_fields/ and property_setter/
#   JSON to avoid drift.
#
# Core review rule:
# Review the PR diff first.
# Use repository and uploaded context only to understand changed behavior.
# Do not audit unrelated old code unless the PR touches, exposes, or worsens it.
#
# Features included:
# - PR Type
# - Description
# - Diagram Walkthrough
# - PR Reviewer Guide
# - Estimated effort
# - Score
# - Tests review
# - TODO scan
# - Security review
# - Multiple PR themes / can-split review
# - Recommended focus areas
# - Configuration issue detection
# - Outdated tooling/version detection
# - PR Code Suggestions table
# - More suggestions checkbox
# - Apply / Chat suggestion flow
# - Author self-review checkbox
############################################################


[config]
# Keep this false in production to avoid noisy PR output.
# Temporarily set true only when debugging Qodo configuration behavior.
output_relevant_configurations = false

# Do not auto-approve PRs from AI review output.
enable_auto_approval = false
auto_approve_for_no_suggestions = false
auto_approve_for_low_review_effort = -1

# Avoid reviewing bot PRs and intentionally skipped PRs.
ignore_bot_pr = true

ignore_pr_labels = [
  "do-not-merge",
  "skip-qodo",
  "wip",
  "draft-only",
  "no-review"
]

ignore_pr_title = [
  "^\\[Auto\\]",
  "^Auto",
  "^\\[Bump\\]",
  "^\\[Release\\]",
  "^\\[Chore\\]\\s+Version",
  "^\\[Bot\\]"
]

ignore_pr_authors = [
  "dependabot[bot]",
  "renovate[bot]",
  "github-actions[bot]"
]

ignore_pr_source_branches = [
  "^dependabot/",
  "^renovate/",
  "^release/",
  "^auto/",
  "^bot/"
]


############################################################
# GitHub App Automation
#
# Legacy Qodo Merge / PR-Agent commands:
# - /describe
# - /review
# - /improve
#
# Production default below:
# - Auto-run /describe and /review on PR open/reopen/ready_for_review.
# - Auto-run only /describe on push to reduce repeated review noise.
# - Keep /improve manual because committable suggestions can be noisy/risky
#   for complex ERPNext stock/accounting/manufacturing code.
#
# If the repository is fully migrated to Qodo v2 agentic commands,
# pilot this replacement on one test repository/PR first:
#
# pr_commands = [
#   "/agentic_describe",
#   "/agentic_review"
# ]
############################################################

[github_app]
handle_pr_actions = ["opened", "reopened", "ready_for_review"]
handle_push_trigger = true

pr_commands = [
  "/describe --pr_description.final_update_message=false",
  "/review"
]

# Keep push automation light to reduce repeated review noise.
push_commands = [
  "/describe --pr_description.final_update_message=false"
]

feedback_on_draft_pr = true


############################################################
# PR Description Generation
############################################################

[pr_description]
enable_pr_diagram = true
final_update_message = false

extra_instructions = '''
Act as a senior Frappe / ERPNext technical writer generating a production-aware PR description.

Use the PR diff as the source of truth.
Use repository context only to explain changed behavior.
Do not invent business intent, DocTypes, fields, roles, hooks, tests, or runtime behavior.

Create a concise PR description with these sections when relevant:

1. PR Type
Classify as one or more:
- Bug fix
- Enhancement
- Refactor
- Performance
- Security
- Tests
- Tooling/config
- Documentation
- Formatting-only
- Mixed

2. Summary
Explain:
- What changed.
- Why the change appears necessary from the diff.
- Which Frappe / ERPNext areas are affected.
- Whether runtime behavior changed or the PR is mostly formatting/configuration.

3. Changed Areas
Mention only changed or directly affected areas:
- DocTypes
- Child tables
- Controllers
- hooks.py
- doc_events
- fixtures
- patches
- workflows
- role permissions
- custom fields
- property setters
- reports
- print formats
- whitelisted methods
- REST APIs
- JavaScript form scripts
