9. JEWELLERY MANUFACTURING / MOP LOG / RESERVATION REVIEW
============================================================

Apply when PR touches:
Employee IR, Department IR, MOP Log, Manufacturing Operation, Manufacturing Work Order, Parent Manufacturing Order, Manufacturing Plan, Main Slip, Stock Entry, Stock Reservation Entry, scheduler/EOD sync, weight calculation, process loss, repack, refining, or operation-wise updates.

Check these invariants:

A. MOP Log idempotency
MOP Log writers must not create duplicate active rows for the same source voucher/row/operation/item/batch. The dedup key must include is_cancelled=0; consider is_synced when the writer is the Stock Entry bridge vs a virtual writer (DIR/EIR submit).

Expected shape:
existing_log = frappe.db.exists(
    "MOP Log",
    {
        "voucher_type": doc.doctype,
        "voucher_no": doc.name,
        "row_name": row.name,
        "manufacturing_operation": operation,
        "item_code": item_code,
        "batch_no": batch_no,
        "is_cancelled": 0,
    },
)
if existing_log:
    return

Reference implementations to mirror, not replace:
- sync_mop_log_for_stock_entry() in doc_events/stock_entry.py (writes is_synced=1).
- create_mop_log_for_department_ir / create_mop_log_for_employee_ir_receive in
  doctype/mop_log/mop_log.py (writes is_synced=0; EOD sync flips to 1).

B. Voucher-scoped source rows
Flag:
- max(flow_index) without voucher context.
- latest MOP Log by manufacturing_operation only.
- receive flow reading its own previous receive output.
- cloning from global tail snapshots.
- source query missing voucher_type/voucher_no/row_name when source voucher is known.

C. Submit/cancel symmetry
If submit creates/updates:
- MOP Log
- Stock Entry
- Stock Reservation Entry
- Manufacturing Operation
- Manufacturing Work Order
- Main Slip rows
- Purchase Order
- process loss records
- weight fields

Cancel must safely reverse, cancel, unlink, or mark inactive:
- no active duplicate MOP Logs
- no duplicate Stock Entries
- no duplicate Stock Reservation Entries
- no stale reservations
- no orphan cloned Manufacturing Operation
- no stale MWO pointer
- no stale Stock Entry Detail link
- no incorrect process loss
- resubmit remains safe

D. Stock Entry vs MOP Log bridge
The is_synced flag on MOP Log is the authoritative dedup mechanism between the two paths:
- sync_mop_log_for_stock_entry() in doc_events/stock_entry.py creates MOP Log
  rows with is_synced=True (the Stock Entry already represents physical
  movement; EOD sync must skip them).
- DIR / EIR / MWO writers create rows with is_synced=0 (virtual). The EOD sync
  scheduler picks them up by filtering is_synced=0, is_cancelled=0, materializes
  them into a consolidated or per-MOP Stock Entry, then sets is_synced=1.
Any change to either path must preserve this invariant: no row should be
materialized twice and no virtual row should remain unsynced after the EOD
sync's success path. Cancellation must mark rows is_cancelled=1 rather than
deleting them, to keep audit lineage.

E. Stock Reservation Entry
Check:
- Reservation creation is idempotent per intended source voucher/item/batch/warehouse.
- Reservation cancellation or unreservation runs when the source document is cancelled.
- Resubmission does not create duplicate active reservations.
- Return, transfer, or repack flows cannot reserve unavailable or already-returned stock.
- Auto-created Stock Entries intended for reservation preserve the expected marker/link.
- Batch, serial, warehouse, item_code, company, and manufacturing_work_order references match the actual stock movement.
- Reservation logic does not rely only on client-side state.
- Reservation helper queries are scoped tightly enough to avoid reserving unrelated Stock Entries or batches.
- Reservation behavior is tested with submit/cancel/resubmit and duplicate execution.

F. Main Slip injection
Implementation: doctype/employee_ir/doc_events/main_slip_inject.py, called from
Employee IR Receive when is_main_slip_required=1 and received_gross_wt >
planned gross_wt.
Walks Main Slip `batch_details` and creates auto Material Transfer (WORK ORDER)
or Repack Stock Entries that carry an `employee_ir` header marker so they can
be reserved by stock_reservation_entry_for_mwo.

Check:
- inventory-type priority order: Regular Stock -> Customer Goods -> Pure Metal.
- per-segment source warehouse is preserved (batch_details vs MSL/raw-material
  fallback when no Main Slip exists).
- validation warehouse equals actual Stock Entry source warehouse.
- alloy transfer is preferred before pure-metal repack when applicable.
- fallback repack only happens when alloy is genuinely unavailable.
- batch_no and inventory_type are propagated correctly to the auto-created SE.
- MSL/raw material vs manufacturing warehouse usage is explicit.
- the `employee_ir` header marker is set so SRE creation can find the SE.
- no debug print statements remain.
- tests match production behavior.

G. Weight and loss calculations
Check:
- gross/net/fine/pure/loss calculations reconcile.
- precision uses Frappe utilities where appropriate.
- no raw float equality for calculated values.
- rounding residuals are handled.
- process loss is created exactly once.
- operation-wise updates do not overwrite later/correct balances with stale snapshots.

H. Manufacturing Operation / MWO pointers
Flag:
- unsafe cloning/deletion.
- wrong current/next operation pointer.
- stale in-transit state.
- status changes not coordinated with linked IR documents.
- changes that break operation sequence.

