  - is_synced=0 on creation; set to 1 only after successful Stock Entry creation in EOD sync.
  - is_cancelled=1 for reversed logs; never physically delete logs.
  - assert_sync_not_running() must block user MOP/SE creation during EOD sync.
  - frappe.flags.mop_sync_in_progress bypasses the sync lock for sync-created documents only.
  - Deduplication key for loss-attribution logs:
    (voucher_type, voucher_no, manufacturing_operation, loss_source_row, loss_type, is_cancelled=0).

STOCK RESERVATION ENTRY:
  - CustomStockReservationEntry.auto_reserve_serial_and_batch() must return early
    when manufacturing_work_order + manufacturing_operation + sb_entries +
    reservation_based_on="Serial and Batch" to preserve MOP batch lineage.
  - EOD sync cancels SREs where remaining_qty > 0 but MOP balance <= 0.

BATCH AUTONAME (Customer Subcontracting):
  - Parent batch: {customer}-{year_code}{month}-{item_code}-{serial}
  - Child batch: {prefix}-{item_code}-{parent_serial}-{alphabet}
  - frappe.flags.is_batch_autoname=True bypasses batch duplicate validation during auto-naming.

SUBMISSION QUEUE:
  - Employee IR, Department IR, Product Certification, Stock Entry, Main Slip
    are queued in background (queue="long", timeout=4500).
  - Duplicate queue prevention: checks existing queue before inserting new entry.

EOD SYNC LOCK:
  - MOP Settings.sync_running acts as a mutual exclusion flag.
  - Stale lock auto-clears after 4 hours.
  - Lock is cleared in a finally-equivalent pattern at end of sync_mop_logs().

SERIAL AND BATCH BUNDLE:
  - Duplicate inward serials are blocked except for "FG Purchase" and "Branch Purchase".
  - Validation is skipped for POS Invoice and Pick List.

